name: Publish Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        type: string
        
permissions:
  contents: write
  # Trusted Publishing: NuGet/login exchanges this job's OIDC token for a short-lived nuget.org API
  # key — no long-lived secret to store or rotate. The policy on nuget.org names THIS workflow file.
  id-token: write
  
jobs:
  release:
    name: Publish release
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -e
          git tag ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }}

      - name: Cache packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props') }}

      # Exchanges the job's OIDC token for a temporary nuget.org API key, per the Trusted Publishing
      # policy registered for this repository + workflow file. NUGET_USER is a repository VARIABLE
      # (Settings → Secrets and variables → Actions → Variables) holding the nuget.org profile name
      # that owns AnalyseTool.Sdk. While it is unset, the step is skipped and the push falls back to
      # the NUGET_API_KEY secret below — so either auth mode works, and having neither fails the
      # release loudly.
      - name: NuGet login (trusted publishing)
        id: nuget-login
        if: vars.NUGET_USER != ''
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      # PublishSdkPackage is part of the release, not an option: the design doc makes publishing the
      # package a release condition, and release 1.4.4 already proved why — its notes announced SDK
      # 1.1.1, but nothing in this pipeline pushed it, so nuget.org silently stayed at 1.1.0. The
      # target runs the full Ci gate first and skips versions the feed already has, so releases that
      # do not bump the SDK version are a no-op on the feed.
      - name: Publish release
        run: ./src/build.cmd PublishGitHub PublishSdkPackage --ReleaseVersion ${{ github.event.inputs.version || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NuGetApiKey: ${{ steps.nuget-login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
