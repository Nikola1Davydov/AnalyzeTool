name: Release

# A tag vX.Y.Z publishes AnalyseTool X.Y.Z: the whole pipeline with the installers (`build -- pack`), then a GitHub
# release with both MSIs, the Autodesk bundle and the section of CHANGELOG.md of that version as its notes.
#   git tag v2.0.0 && git push origin v2.0.0
# or on GitHub: Releases › Draft a new release › a new tag v2.0.0 on main › Publish — the release gets the files a few
# minutes later. CHANGELOG.md must have «## [2.0.0] / <date>» (not «unreleased») on that commit, or nothing is published.
# GitVersion takes the version from the tag. A tag with a suffix (v2.1.0-beta.1) makes a pre-release.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: windows-2025
    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: The changelog has this version
        id: notes
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          $text = (Get-Content CHANGELOG.md -Raw) -replace "`r`n", "`n"
          $match = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($version))\]([^\n]*)\n(.*?)(?=^## \[|\z)")
          if (-not $match.Success) { throw "CHANGELOG.md has no section «## [$version]»: add it before tagging." }
          if ($match.Groups[1].Value -match "unreleased") { throw "CHANGELOG.md still says «## [$version] / unreleased»: put the date of the release there." }
          Set-Content -Path release-notes.md -Value $match.Groups[2].Value.Trim() -Encoding utf8
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            source/AnalyseTool/ClientApp/package-lock.json
            source/AnalyseTool.Hosting.WebView/revit-bridge/package-lock.json

      - name: Cache packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Build, test and pack the installers
        run: dotnet run -c Release -- pack
        working-directory: "build"
        env:
          DOTNET_ENVIRONMENT: Production

      - name: The installers carry this version
        shell: pwsh
        run: |
          $version = "${{ steps.notes.outputs.version }}"
          $installers = Get-ChildItem output -Filter "AnalyseTool-$version-*.msi"
          if ($installers.Count -ne 2) { throw "Expected AnalyseTool-$version-SingleUser.msi and -MultiUser.msi in output/, found: $((Get-ChildItem output).Name -join ', ')" }
          if (-not (Test-Path output/AnalyseTool.bundle.zip)) { throw "output/AnalyseTool.bundle.zip is missing" }
          Copy-Item output/AnalyseTool.bundle.zip "output/AnalyseTool-$version.bundle.zip"

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.notes.outputs.version }}"
          $files = @(Get-ChildItem output -Filter "AnalyseTool-$version-*.msi" | ForEach-Object FullName) + "output/AnalyseTool-$version.bundle.zip"
          $tag = "${{ github.ref_name }}"
          # A release made on GitHub (Releases › Draft a new release, with a new tag) already exists: it gets the files, and the
          # changelog as its notes when they were left empty. A tag pushed from git gets a new release.
          gh release view $tag --json body *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
            $body = gh release view $tag --json body --jq .body
            if ([string]::IsNullOrWhiteSpace($body)) { gh release edit $tag --notes-file release-notes.md }
          } else {
            $prerelease = if ($version -match "-") { "--prerelease" } else { "--latest" }
            gh release create $tag @files --title "AnalyseTool $version" --notes-file release-notes.md $prerelease
          }
