name: Release

# The version lives in the code: "Build" › "Version" of build/appsettings.json (local builds and installers carry it too).
# A push to main with a version that has no tag yet publishes it: the whole pipeline with the installers
# (`build -- pack`), then the tag vX.Y.Z and a GitHub release with both MSIs, the Autodesk bundle and the section of
# CHANGELOG.md of that version as its notes. A version that is tagged already: nothing happens.
# To release: raise the version, date its section in CHANGELOG.md («## [X.Y.Z] / <date>»), merge into main.
# A version with a suffix (2.1.0-beta.1) makes a pre-release.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: windows-2025
    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: The version and whether it is released
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content build/appsettings.json -Raw | ConvertFrom-Json).Build.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw "build/appsettings.json has no Build.Version." }
          git rev-parse -q --verify "refs/tags/v$version" *> $null
          $released = $LASTEXITCODE -eq 0
          "version=$version" >> $env:GITHUB_OUTPUT
          "release=$(if ($released) { 'false' } else { 'true' })" >> $env:GITHUB_OUTPUT
          if ($released) { "v$version is released already: nothing to do. Raise Build.Version to release." }

      - name: The changelog has this version
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $text = (Get-Content CHANGELOG.md -Raw) -replace "`r`n", "`n"
          $match = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($version))\]([^\n]*)\n(.*?)(?=^## \[|\z)")
          if (-not $match.Success) { throw "CHANGELOG.md has no section «## [$version]»." }
          if ($match.Groups[1].Value -match "unreleased") { throw "CHANGELOG.md still says «## [$version] / unreleased»: put the date of the release there." }
          Set-Content -Path release-notes.md -Value $match.Groups[2].Value.Trim() -Encoding utf8

      - name: Setup Node.js
        if: steps.version.outputs.release == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            source/AnalyseTool/ClientApp/package-lock.json
            source/AnalyseTool.Hosting.WebView/revit-bridge/package-lock.json

      - name: Cache packages
        if: steps.version.outputs.release == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Build, test and pack the installers
        if: steps.version.outputs.release == 'true'
        run: dotnet run -c Release -- pack
        working-directory: "build"
        env:
          DOTNET_ENVIRONMENT: Production

      - name: Publish the release
        if: steps.version.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $installers = @(Get-ChildItem output -Filter "AnalyseTool-$version-*.msi" | ForEach-Object FullName)
          if ($installers.Count -ne 2) { throw "Expected AnalyseTool-$version-SingleUser.msi and -MultiUser.msi in output/, found: $((Get-ChildItem output).Name -join ', ')" }
          Copy-Item output/AnalyseTool.bundle.zip "output/AnalyseTool-$version.bundle.zip"
          $prerelease = if ($version -match "-") { "--prerelease" } else { "--latest" }
          # Makes the tag v<version> on this commit, and the release
          gh release create "v$version" @installers "output/AnalyseTool-$version.bundle.zip" --target "${{ github.sha }}" --title "AnalyseTool $version" --notes-file release-notes.md $prerelease
