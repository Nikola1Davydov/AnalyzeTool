name: CI

# Thin wrapper: ALL CI logic lives in the Nuke build (src/build/Build.Ci.cs, target `Ci`), so the
# exact same guardrails run locally via `src\build.cmd Ci`:
#   1. dependency contract + headless Core/Tools invariant
#   2. command schema contract (every command describes itself, its input and its output)
#   3. the full plugin chain compiles for every Revit year (R25/R26 = net8, R27 = net10)
#   4. the Sdk NUPKG works for an external extension author (pack -> build sample against it)

# Every branch, not just main/dev: the Sdk's build files (Extension.props, Sdk.targets) are consumed
# by extension repositories that check this repo out by BRANCH, so an unverified push there breaks
# builds outside this repository. TestSdkPackage is the guardrail that catches it — it has to run
# before the push is visible to anyone, not after someone reports the failure.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# This job builds and runs code from every pushed branch; it needs to read the repo and nothing else.
# Without this block the token inherits the repository default, which may still be write-all.
permissions:
  contents: read

jobs:
  build:
    name: Build + guardrails
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (8 + 10)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          # Without this, any .csproj edit means a fully cold restore instead of a near-hit.
          restore-keys: ${{ runner.os }}-nuget-

      - name: Run CI guardrails (Nuke)
        run: ./src/build.cmd Ci

      - name: Upload SDK package artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-nupkg
          path: artifacts/sdk-nupkg/*.nupkg
