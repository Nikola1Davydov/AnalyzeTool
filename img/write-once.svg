<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-labelledby="t d">
  <title id="t">Write a command once, call it from everywhere</title>
  <desc id="d">A ribbon button and an AI agent over MCP both call the same IRevitTask command through one command queue.</desc>
  <style>
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .hot { fill: #ddf4ff; stroke: #54aeff; }
    .title { font: 600 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .sub { font: 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
    .code { font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #59636e; }
    .line { stroke: #8c959f; stroke-width: 1.5; fill: none; }
    .dot { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #3d444d; }
      .hot { fill: #0c2d4d; stroke: #1f6feb; }
      .title { fill: #f0f6fc; }
      .sub, .code { fill: #9198a1; }
      .line { stroke: #656c76; }
      .dot { fill: #4493f8; }
    }
    @media (prefers-reduced-motion: reduce) { .moving { display: none; } }
  </style>

  <path id="p1" class="line" d="M300,80 C450,80 470,130 610,130"/>
  <path id="p2" class="line" d="M300,180 C450,180 470,130 610,130"/>

  <circle class="dot moving" r="6"><animateMotion dur="2.4s" begin="0s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
  <!-- Hidden until its delayed start: before it, an unanimated circle sits at 0,0. -->
  <circle class="dot moving" r="6" visibility="hidden"><set attributeName="visibility" to="visible" begin="1.2s" fill="freeze"/><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>

  <rect class="box" x="20" y="52" width="280" height="56" rx="10"/>
  <text class="title" x="40" y="76">Ribbon button</text>
  <text class="sub" x="40" y="95">a click runs the command</text>

  <rect class="box" x="20" y="152" width="280" height="56" rx="10"/>
  <text class="title" x="40" y="176">AI agent over MCP</text>
  <text class="sub" x="40" y="195">the command is a tool with its schemas</text>

  <rect class="box hot" x="610" y="85" width="270" height="90" rx="10"/>
  <text class="title" x="745" y="119" text-anchor="middle">Your command</text>
  <text class="code" x="745" y="141" text-anchor="middle">class Count : IRevitTask</text>
  <text class="sub" x="745" y="160" text-anchor="middle">one implementation, one queue</text>
</svg>
