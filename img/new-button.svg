<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="t d">
  <title id="t">Creating a ribbon button with New</title>
  <desc id="d">Click New on the AnalyseTool ribbon, give the extension a name — the id and tooltip follow it — and click Create. The extension folder is written and its button appears on the ribbon in the Extensions panel.</desc>
  <style>
    .panel { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
    .field { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
    .sep { stroke: #d0d7de; stroke-width: 1; }
    .text { font: 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .small { font: 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636e; }
    .label { font: 600 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .h { font: 700 18px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .mono { font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #1f2328; }
    .icon { fill: #8c959f; }
    .accent { fill: #0969da; }
    .accent-stroke { stroke: #0969da; }
    .ok { fill: #1a7f37; }
    .hl { fill: #0969da; fill-opacity: 0.14; stroke: #0969da; stroke-width: 1.2; }
    .btn-text { font: 600 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; }
    .cursor { fill: #1f2328; stroke: #ffffff; stroke-width: 1.2; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #161b22; stroke: #3d444d; }
      .card { fill: #0d1117; stroke: #3d444d; }
      .field { fill: #0d1117; stroke: #3d444d; }
      .sep { stroke: #3d444d; }
      .text, .label, .h, .mono { fill: #f0f6fc; }
      .small { fill: #9198a1; }
      .icon { fill: #656c76; }
      .accent { fill: #4493f8; }
      .accent-stroke { stroke: #4493f8; }
      .ok { fill: #3fb950; }
      .hl { fill: #4493f8; stroke: #4493f8; }
      .cursor { fill: #f0f6fc; stroke: #0d1117; }
    }
  </style>

  <defs>
    <!-- The "typing": each value is revealed by a clip that widens. All animations share one 10 s cycle. -->
    <clipPath id="typeName"><rect x="270" y="201" height="26" width="0"><animate attributeName="width" dur="10s" repeatCount="indefinite" values="0;0;150;150" keyTimes="0;0.18;0.30;1"/></rect></clipPath>
    <clipPath id="typeId"><rect x="460" y="201" height="26" width="0"><animate attributeName="width" dur="10s" repeatCount="indefinite" values="0;0;170;170" keyTimes="0;0.18;0.30;1"/></rect></clipPath>
    <clipPath id="typeTip"><rect x="270" y="251" height="26" width="0"><animate attributeName="width" dur="10s" repeatCount="indefinite" values="0;0;150;150" keyTimes="0;0.18;0.30;1"/></rect></clipPath>
  </defs>

  <!-- ===== The ribbon ===== -->
  <rect class="panel" x="20" y="20" width="860" height="100" rx="8"/>
  <line class="sep" x1="112" y1="30" x2="112" y2="110"/>
  <line class="sep" x1="320" y1="30" x2="320" y2="110"/>

  <rect class="accent" x="46" y="32" width="38" height="38" rx="8" opacity="0.85"/>
  <text class="btn-text" x="65" y="57" text-anchor="middle">A</text>
  <text class="text" x="65" y="88" text-anchor="middle">AnalyseTool</text>

  <g>
    <circle class="icon" cx="134" cy="44" r="5"/><text class="text" x="146" y="48">Settings</text>
    <circle class="icon" cx="134" cy="66" r="5"/><text class="text" x="146" y="70">Report a bug</text>
    <circle class="icon" cx="134" cy="88" r="5"/><text class="text" x="146" y="92">About</text>
    <circle class="icon" cx="240" cy="44" r="5"/><text class="text" x="252" y="48">Reload</text>
    <circle class="icon" cx="240" cy="66" r="5"/><text class="text" x="252" y="70">Extensions</text>
    <circle class="icon" cx="240" cy="88" r="5"/><text class="text" x="252" y="92">New</text>
  </g>
  <rect class="hl" x="231" y="78" width="56" height="20" rx="4" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.085;0.095;0.13;0.15;1"/>
  </rect>

  <text class="small" x="65" y="112" text-anchor="middle">Parameter</text>
  <text class="small" x="216" y="112" text-anchor="middle">Manage</text>
  <text class="small" x="372" y="112" text-anchor="middle">Extensions</text>

  <!-- the new button: appears once Create is done -->
  <g opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.50;0.53;0.90;0.93;1"/>
    <circle class="accent" cx="372" cy="51" r="26" opacity="0">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;0.25;0;0" keyTimes="0;0.51;0.55;0.68;1"/>
      <animate attributeName="r" dur="10s" repeatCount="indefinite" values="18;18;30;30" keyTimes="0;0.51;0.68;1"/>
    </circle>
    <rect class="accent" x="356" y="35" width="32" height="32" rx="7"/>
    <text class="btn-text" x="372" y="56" text-anchor="middle">R</text>
    <text class="text" x="372" y="88" text-anchor="middle">Room Sheets</text>
  </g>

  <!-- ===== The New extension window ===== -->
  <g opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.12;0.15;0.88;0.92;1"/>
    <rect class="card" x="250" y="140" width="400" height="225" rx="10"/>

    <!-- the form -->
    <g>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.46;0.47;1"/>
      <text class="h" x="270" y="172">New extension</text>

      <text class="label" x="270" y="195">Name</text>
      <rect class="field" x="270" y="201" width="170" height="26" rx="5"/>
      <text class="text" x="280" y="219" clip-path="url(#typeName)">Room Sheets</text>

      <text class="label" x="460" y="195">Id</text>
      <rect class="field" x="460" y="201" width="170" height="26" rx="5"/>
      <text class="mono" x="468" y="218" clip-path="url(#typeId)">company.room-sheets</text>

      <text class="label" x="270" y="245">Tooltip</text>
      <rect class="field" x="270" y="251" width="360" height="26" rx="5"/>
      <text class="text" x="280" y="269" clip-path="url(#typeTip)">Open Room Sheets</text>

      <text class="small" x="270" y="300">plugin.json · index.html · a C# project · README.md</text>

      <text class="text" x="508" y="340" text-anchor="middle" opacity="0.7">Cancel</text>
      <rect class="accent" x="550" y="320" width="80" height="30" rx="6">
        <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0.45;0.45;1;1;0.7;1;1" keyTimes="0;0.29;0.31;0.43;0.44;0.46;1"/>
      </rect>
      <text class="btn-text" x="590" y="340" text-anchor="middle">Create</text>
    </g>

    <!-- created -->
    <g opacity="0">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.46;0.48;1"/>
      <circle class="ok" cx="281" cy="172" r="10"/>
      <path d="M276,172 l4,4 l7,-8" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="h" x="300" y="179">Created</text>
      <text class="text" x="270" y="210">Its button is on the ribbon. The files are here:</text>
      <text class="mono" x="270" y="232">…\AnalyseTool\extensions\room-sheets</text>
      <rect class="accent" x="270" y="262" width="110" height="30" rx="6"/>
      <text class="btn-text" x="325" y="282" text-anchor="middle">Open folder</text>
    </g>
  </g>

  <!-- ===== The cursor ===== -->
  <path class="cursor" d="M0,0 L0,16 L4.5,12 L7.5,19 L10,18 L7,11 L12.5,11 Z">
    <animateMotion dur="10s" repeatCount="indefinite" calcMode="spline"
      values="620,330; 262,90; 262,90; 600,290; 600,290; 590,340; 590,340; 700,360; 700,360"
      keyTimes="0; 0.08; 0.16; 0.24; 0.36; 0.42; 0.47; 0.55; 1"
      keySplines="0.4 0 0.2 1; 0 0 1 1; 0.4 0 0.2 1; 0 0 1 1; 0.4 0 0.2 1; 0 0 1 1; 0.4 0 0.2 1; 0 0 1 1"/>
  </path>
</svg>
